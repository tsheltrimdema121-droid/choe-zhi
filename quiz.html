<!DOCTYPE html>
<html>
<head>
    <title>Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-page">

<div class="navbar">
    <h2>Choe Zhi</h2>
    <a href="index.html">Home</a>
</div>

<div class="glass-box">

<h1>Career Readiness Quiz</h1>

<form id="quizForm">

<input type="text" id="name" placeholder="Your Name"><br><br>

<label>What do you enjoy most?</label>
<select id="interest">
<option>Technology</option>
<option>Helping People</option>
<option>Business</option>
<option>Creative Work</option>
</select><br><br>

<label>Confidence Level</label>
<input type="range" id="confidence" min="1" max="10"><br><br>

<button type="submit">See Result</button>

</form>

</div>

<script>
document.getElementById("quizForm").addEventListener("submit", function(e){
e.preventDefault();

let data = {
name: document.getElementById("name").value,
interest: document.getElementById("interest").value,
confidence: document.getElementById("confidence").value
};

localStorage.setItem("quizData", JSON.stringify(data));
window.location.href = "result.html";
});
</script>

</body>
</html>
